<!-- ForeCal: the sun rising over a week of days, today lit under it. On the macOS icon grid (824 pt tile on a 1024 canvas). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/><stop offset="1" stop-color="#BFE0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="560" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A0" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD43B"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="460" fill="url(#sky)"/>
    <circle cx="512" cy="560" r="300" fill="url(#glow)"/>
    <circle cx="512" cy="560" r="150" fill="url(#sun)"/>
    <rect x="100" y="560" width="824" height="364" fill="#FFFFFF"/>
    <g fill="#DCE3EE">
      <rect x="190" y="620" width="70" height="70" rx="16"/><rect x="290" y="620" width="70" height="70" rx="16"/><rect x="390" y="620" width="70" height="70" rx="16"/><rect x="490" y="620" width="70" height="70" rx="16"/><rect x="590" y="620" width="70" height="70" rx="16"/><rect x="690" y="620" width="70" height="70" rx="16"/><rect x="790" y="620" width="70" height="70" rx="16"/>
      <rect x="190" y="720" width="70" height="70" rx="16"/><rect x="290" y="720" width="70" height="70" rx="16"/><rect x="390" y="720" width="70" height="70" rx="16"/><rect x="590" y="720" width="70" height="70" rx="16"/><rect x="690" y="720" width="70" height="70" rx="16"/><rect x="790" y="720" width="70" height="70" rx="16"/>
    </g>
    <rect x="490" y="720" width="70" height="70" rx="16" fill="#FF9F1C"/>
  </g>
</svg>
